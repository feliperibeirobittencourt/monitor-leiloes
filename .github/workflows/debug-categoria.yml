name: Debug - categoria do lote Ethnographia Brazileira

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4 playwright

      - name: Rodar diagnóstico
        run: python scripts_debug_categoria4.py

      - name: Publicar resultado
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add debug_categoria4_output.txt
          git commit -m "Debug: procurar codigos de categoria reais no HTML da pagina" || echo "nada novo"
          git pull --rebase --autostash origin main
          git push
